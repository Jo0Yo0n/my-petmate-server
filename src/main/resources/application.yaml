spring:
  application:
    name: my-petmate-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # JSON/bodyless endpoints must not eagerly parse an unrelated multipart body.
      resolve-lazily: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: my-petmate-server
    audience: my-petmate-api
  token:
    access-token-ttl: 900s
    refresh-token-ttl: 2592000s
    token-type: Bearer

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
