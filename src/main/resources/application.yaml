spring:
  application:
    name: my-petmate-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/my_petmate}
    username: ${DB_USERNAME:my_petmate}
    password: ${DB_PASSWORD:my_petmate}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
