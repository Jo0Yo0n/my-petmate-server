goal: >
  Build the My Petmate MVP with a Spring Boot and PostgreSQL API and a
  React Native/Expo app, enabling pet guardians to register one or more dogs,
  receive safety- and compatibility-based nearby walking/playmate
  recommendations, mutually like matches, chat in real time, and coordinate
  walk/play appointments with private post-appointment feedback.

constraints:
  - Backend must use Spring Boot.
  - Backend must use Java 21 LTS, Spring Boot 3.x, and Gradle Kotlin DSL.
  - Backend formatting must use Spotless with Google Java Format, and
    `./gradlew check` must include formatting verification.
  - Commit messages must follow Conventional Commits in English.
  - Branch names must follow `<type>/<short-kebab-summary>`.
  - Pull requests must use the repository PR template with Summary, Changes,
    Verification, and Checklist sections.
  - AI agents must read `AGENTS.md` and `docs/development-conventions.md`
    before code or build changes.
  - Primary database must be PostgreSQL only for MVP.
  - Mobile app must use React Native with Expo for Android and iOS development.
  - MVP authentication must use email/password with JWT access token, refresh
    token, password hashing, token refresh, and logout.
  - Social login, phone verification, device/session management, push
    notifications, map exploration, calendar integration, payment, public
    reviews/ratings, group walks, admin web UI, and document proof review are
    out of scope for MVP.
  - Exact real-time location must not be shown to users; only approximate
    distance and primary activity area may be displayed.
  - Guardian gender, couple status, or family status is displayed and filterable
    only when the guardian explicitly sets identity visibility to public.
  - >
    Identity disclosure is reciprocal for recommendations: a guardian who
    publishes identity receives only candidates who also publish identity.
  - One guardian account may register multiple dogs, but recommendation, like,
    match, chat, and appointment flows operate on one selected dog pair at a
    time.
  - Matching recommendations are calculated on request, not precomputed by batch
    jobs.
  - Recommendation preference filters are optional ranking inputs only; server
    safety exclusions always run first and cannot be weakened by a client.
  - Dog photos are uploaded through the API to a private S3 bucket, and clients
    receive expiring read URLs rather than permanent public object URLs.
  - A closed match cannot be reopened or used for chat in the MVP; closing a
    match is distinct from blocking or reporting a guardian.
  - Chat history uses cursor pagination, and WebSocket message sends use a
    client-generated idempotency key with explicit success or error events.
  - REST errors use RFC 9457 ProblemDetail with application/problem+json and
    My Petmate extensions code, optional fieldErrors, and requestId.

acceptance_criteria:
  - A guardian can sign up, log in, log out, refresh tokens, and access
    protected API/app screens only with valid JWT authentication.
  - A guardian can register as an individual, couple, or family, provide gender
    only for an individual account, and change whether that identity is public.
  - A guardian can create and edit dog profiles containing required safety and
    compatibility fields, including dog identity, photo, breed, age,
    sex, weight/size, neuter status, activity area, available time slots,
    vaccination status, animal registration status, sociability, aggression
    level, preferred walk intensity, reaction to unfamiliar dogs, and
    self-introduction.
  - A dog breed is selected from the server-supported breed list, where
    mixed_breed is one normal option and no separate mixed-breed boolean exists.
  - The app shows a recommendation list and detail screen for the selected dog,
    excluding unsafe or clearly incompatible candidates and displaying
    compatibility grade plus human-readable reasons instead of numeric
    percentage scores.
  - A guardian can like or pass recommended dogs, and a match is created only
    when both sides like each other for the relevant dog pair.
  - Matched guardians can use a WebSocket-based 1:1 chat room and exchange
    normal text messages plus appointment proposal cards.
  - In a chat room, a guardian can propose an appointment with date, start time,
    end time, and place text; the other guardian can accept or reject it; an
    accepted appointment can later be canceled with a reason.
  - After an accepted appointment's end time, each participating guardian can
    submit one private 1-to-5 review of the other guardian with optional tags and
    comment; the review and aggregate score are not shown to the other user.
  - A guardian can block or report another guardian, and reported or blocked
    users are excluded from relevant matching/chat interactions; accumulated
    reports or server-classified high-risk report reasons can temporarily
    restrict matching/chat access.
  - A report uses one allowed reason and an optional comment; the reporting user
    does not choose a severity.
  - An authenticated guardian can restore the app session from a current-user
    response containing guardian identity and account status.
  - A guardian can upload an initial dog photo with profile creation and replace
    the photo later; the app never needs to submit a public storage URL.
  - A guardian can apply optional size, walk intensity, sociability, available
    day, maximum-distance, and public guardian-identity filters to
    recommendations without bypassing safety exclusions or exposing private
    identity data.
  - A public guardian receives only public-identity candidates and can use
    guardian identity filters. A private guardian cannot use those filters and
    sees all candidate guardian identities as private.
  - A guardian can close an active match without blocking the other guardian,
    and a closed match no longer permits message reads or sends.
  - Chat history can be paged backward, duplicate WebSocket sends do not create
    duplicate stored messages, and send success or failure is explicit.
  - A match list exposes the latest message preview and unread message count,
    and opening a chat can advance the guardian's read position.
  - REST validation, authentication, authorization, not-found, conflict, upload,
    and server errors conform to the shared ProblemDetail contract.

api_contract_additions:
  - name: current_guardian
    method_and_path:
      - GET /api/guardians/me
      - PATCH /api/guardians/me
    milestone: M1
    purpose: >
      Restore the authenticated guardian and let the owner change individual,
      couple, or family presentation and its visibility.
    response_fields:
      - id
      - email
      - profileType
      - gender
      - identityVisibility
      - status
    rules:
      - profileType is individual, couple, or family.
      - gender is required for individual and must be absent for couple or family.
      - identityVisibility is public or private.

  - name: dog_photo_upload
    method_and_path:
      - POST /api/dogs
      - POST /api/dogs/{dogId}/photos
    milestone: M2
    purpose: >
      Create a dog with multipart profile JSON plus an initial photo, and replace
      an owned dog's photo later without accepting a client-managed public URL.
    rules:
      - The create request uses multipart fields named profile and photo.
      - The replacement request uses a multipart field named photo.
      - The server validates ownership, media type, dimensions, and size.
      - The response returns an expiring photo URL.

  - name: recommendation_filters
    method_and_path: GET /api/dogs/{dogId}/recommendations
    milestone: M3
    optional_query_parameters:
      - sizeGroups
      - walkIntensities
      - sociabilityLevels
      - availableDays
      - maxDistanceKm
      - guardianIdentities
    rules:
      - Safety and block/report exclusions run before preference filtering.
      - Omitted parameters mean no preference restriction for that dimension.
      - Invalid or unsupported values return a validation error.
      - guardianIdentities accepts female, male, couple, and family.
      - A public requester receives only candidates whose identity is public,
        even when guardianIdentities is omitted.
      - A public requester can use guardianIdentities to narrow that public
        candidate pool.
      - A private requester may receive public and private candidates, but every
        guardianIdentity field is masked in the response.
      - A private requester cannot use guardianIdentities; the API returns
        IDENTITY_DISCLOSURE_REQUIRED.

  - name: close_match
    method_and_path: POST /api/matches/{matchId}/close
    milestone: M4
    purpose: Close an active match without blocking or reporting either guardian.
    rules:
      - Only a participating guardian can close the match.
      - Closing an already closed match is idempotent.
      - Closed matches reject future message reads and sends.

  - name: reliable_chat
    method_and_path:
      - GET /api/matches/{matchId}/messages?before={cursor}&limit={limit}
      - WS /ws
    milestone: M5
    purpose: Provide backward history pagination and idempotent message delivery.
    websocket_contract:
      client_send_fields: [matchId, clientMessageId, body]
      server_event_types: [auth_ok, message_created, message_error]
      idempotency_scope: [match_id, sender_guardian_id, client_message_id]

  - name: unread_messages
    method_and_path:
      - GET /api/matches
      - POST /api/matches/{matchId}/read
    milestone: M5
    purpose: Show latest-message context and advance a guardian's read position.
    match_list_fields: [latestMessagePreview, latestMessageAt, unreadCount]
    read_request_fields: [lastReadMessageId]

  - name: appointment_review
    method_and_path: POST /api/appointment-proposals/{proposalId}/review
    milestone: M6
    purpose: >
      Let each participant privately evaluate the other guardian once after an
      accepted appointment has ended.
    request_fields: [score, tags, comment]
    response_projection_fields: [reviewEligible, reviewSubmitted]
    rules:
      - Score is an integer from 1 through 5.
      - Tags are optional and limited to on_time, respectful_communication,
        safe_handling, dog_profile_accurate, and would_meet_again.
      - Comment is optional and limited to 500 characters.
      - The appointment must be accepted and its end time in Asia/Seoul must
        have passed.
      - Each guardian can review a proposal only once and only the other guardian.
      - Raw reviews and aggregate scores are private in the MVP.

api_error_contract:
  standard: RFC 9457 Problem Details
  media_type: application/problem+json
  required_fields: [type, title, status, detail, instance, code, requestId]
  optional_fields: [fieldErrors]
  rules:
    - The body status equals the HTTP response status.
    - Apps branch on code, not on the human-readable detail.
    - fieldErrors is present only when field-level validation details exist.
    - instance contains the request path without sensitive query values.
    - MVC and Spring Security errors use the same response shape.
  error_codes:
    - VALIDATION_FAILED
    - IDENTITY_DISCLOSURE_REQUIRED
    - AUTH_TOKEN_EXPIRED
    - AUTH_TOKEN_INVALID
    - AUTH_INVALID_CREDENTIALS
    - AUTH_REFRESH_INVALID
    - FORBIDDEN
    - ACCOUNT_RESTRICTED
    - RESOURCE_NOT_FOUND
    - EMAIL_ALREADY_EXISTS
    - STATE_CONFLICT
    - MATCH_CLOSED
    - MATCH_BLOCKED
    - APPOINTMENT_STATE_CONFLICT
    - REVIEW_NOT_ELIGIBLE
    - REVIEW_ALREADY_SUBMITTED
    - PAYLOAD_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - METHOD_NOT_ALLOWED
    - NOT_ACCEPTABLE
    - INTERNAL_SERVER_ERROR

ontology_schema:
  name: MyPetmateMvp
  description: Domain model for the My Petmate compatibility-based dog
    walking/playmate MVP.
  entities:
    - name: Guardian
      fields:
        - name: id
          type: uuid
          required: true
        - name: email
          type: string
          required: true
        - name: password_hash
          type: string
          required: true
        - name: profile_type
          type: enum
          values: [individual, couple, family]
          required: true
        - name: gender
          type: enum
          values: [female, male]
          required: false
        - name: identity_visibility
          type: enum
          values: [public, private]
          required: true
        - name: status
          type: enum
          values: [active, temporarily_restricted, withdrawn]
          required: true

    - name: Dog
      fields:
        - name: id
          type: uuid
          required: true
        - name: guardian_id
          type: uuid
          required: true
        - name: name
          type: string
          required: true
        - name: photo_object_key
          type: string
          required: true
        - name: breed
          type: string
          required: true
          allowed_special_values: [mixed_breed]
        - name: age
          type: integer
          minimum: 0
          maximum: 30
          required: true
        - name: sex
          type: enum
          values: [female, male]
          required: true
        - name: weight_kg
          type: number
          required: true
        - name: size_group
          type: enum
          values: [small, medium, large]
          required: true
        - name: neutered
          type: boolean
          required: true
        - name: primary_activity_area
          type: string
          required: true
        - name: approximate_location
          type: geo_point
          required: true
        - name: available_time_slots
          type: array
          required: true
        - name: vaccinated
          type: boolean
          required: true
        - name: animal_registered
          type: boolean
          required: true
        - name: sociability
          type: enum
          values: [low, medium, high]
          required: true
        - name: aggression_level
          type: enum
          values: [none, low, medium, high]
          required: true
        - name: preferred_walk_intensity
          type: enum
          values: [slow, moderate, active]
          required: true
        - name: unfamiliar_dog_reaction
          type: enum
          values: [calm, cautious, excited, reactive]
          required: true
        - name: self_introduction
          type: string
          required: true

    - name: Recommendation
      fields:
        - name: source_dog_id
          type: uuid
          required: true
        - name: candidate_dog_id
          type: uuid
          required: true
        - name: candidate_photo_url
          type: string
          required: true
        - name: compatibility_grade
          type: enum
          values: [excellent, good, check_conditions]
          required: true
        - name: reasons
          type: array
          required: true
        - name: approximate_distance_km
          type: number
          required: true
        - name: applied_filters
          type: object
          required: false
        - name: guardian_identity
          type: enum
          values: [female, male, couple, family]
          required: false

    - name: Like
      fields:
        - name: from_dog_id
          type: uuid
          required: true
        - name: to_dog_id
          type: uuid
          required: true
        - name: status
          type: enum
          values: [liked, passed]
          required: true

    - name: Match
      fields:
        - name: id
          type: uuid
          required: true
        - name: dog_a_id
          type: uuid
          required: true
        - name: dog_b_id
          type: uuid
          required: true
        - name: status
          type: enum
          values: [active, blocked, closed]
          required: true
        - name: closed_at
          type: datetime
          required: false

    - name: ChatMessage
      fields:
        - name: id
          type: uuid
          required: true
        - name: match_id
          type: uuid
          required: true
        - name: sender_guardian_id
          type: uuid
          required: true
        - name: client_message_id
          type: uuid
          required: true
        - name: message_type
          type: enum
          values: [text, appointment_proposal]
          required: true
        - name: body
          type: string
          required: false
        - name: created_at
          type: datetime
          required: true

    - name: MatchReadState
      fields:
        - name: match_id
          type: uuid
          required: true
        - name: guardian_id
          type: uuid
          required: true
        - name: last_read_message_id
          type: uuid
          required: false
        - name: updated_at
          type: datetime
          required: true

    - name: AppointmentProposal
      fields:
        - name: id
          type: uuid
          required: true
        - name: match_id
          type: uuid
          required: true
        - name: proposed_by_guardian_id
          type: uuid
          required: true
        - name: date
          type: date
          required: true
        - name: start_time
          type: time
          required: true
        - name: end_time
          type: time
          required: true
        - name: place_text
          type: string
          required: true
        - name: status
          type: enum
          values: [proposed, accepted, rejected, canceled]
          required: true
        - name: cancellation_reason
          type: string
          required: false

    - name: AppointmentReview
      fields:
        - name: id
          type: uuid
          required: true
        - name: appointment_proposal_id
          type: uuid
          required: true
        - name: reviewer_guardian_id
          type: uuid
          required: true
        - name: target_guardian_id
          type: uuid
          required: true
        - name: score
          type: integer
          minimum: 1
          maximum: 5
          required: true
        - name: tags
          type: array
          item_values:
            - on_time
            - respectful_communication
            - safe_handling
            - dog_profile_accurate
            - would_meet_again
          required: false
        - name: comment
          type: string
          max_length: 500
          required: false
        - name: created_at
          type: datetime
          required: true

    - name: SafetyAction
      fields:
        - name: id
          type: uuid
          required: true
        - name: reporter_guardian_id
          type: uuid
          required: true
        - name: target_guardian_id
          type: uuid
          required: true
        - name: type
          type: enum
          values: [block, report]
          required: true
        - name: reason
          type: enum
          values:
            - inappropriate_language
            - harassment
            - threatening_behavior
            - unsafe_dog_handling
            - false_profile
            - no_show
            - other
          required: false
        - name: comment
          type: string
          max_length: 1000
          required: false

evaluation_principles:
  - name: safety_first
    description: Unsafe or clearly incompatible dog pairings must be excluded
      before ranking.
    weight: 1.0
  - name: mvp_scope_control
    description: Implement only the agreed MVP and avoid excluded features.
    weight: 0.9
  - name: appointment_validation
    description: Success is measured by actual accepted appointments and
      completed private feedback, not only matches.
    weight: 0.9
  - name: privacy
    description: Location exposure must stay approximate, and private guardian
      identity must never be exposed or inferred through filters.
    weight: 0.8
  - name: simplicity
    description: Prefer request-time recommendation and PostgreSQL-only
      persistence until real scale requires more.
    weight: 0.7

success_metrics:
  - profile_completion_rate
  - recommendation_filter_usage_rate
  - recommendation_to_like_rate
  - mutual_match_rate
  - chat_start_rate
  - unread_message_open_rate
  - match_close_rate
  - appointment_acceptance_rate
  - appointment_review_submission_rate
  - report_rate
  - block_rate
  - temporary_restriction_rate

exit_conditions:
  - name: mvp_scope_satisfied
    description: All acceptance criteria are implemented without adding
      explicitly excluded features.
    criteria: 100% of acceptance criteria are satisfied.
  - name: core_flow_observed
    description: A test guardian can complete signup, dog profile creation,
      recommendation, mutual like, chat, appointment proposal, acceptance, and
      post-appointment review.
    criteria: The full core flow is manually verified in the app against the
      Spring Boot API.
  - name: safety_flow_observed
    description: Blocking, reporting, and temporary restriction behavior are
      verified.
    criteria: Blocked/restricted users are excluded from relevant match/chat
      flows.
  - name: build_and_tests_green
    description: Backend and mobile app checks pass.
    criteria: Required build, test, lint, and type checks exit successfully.

