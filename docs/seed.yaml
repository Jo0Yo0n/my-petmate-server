document:
  title: My Petmate MVP 제품 요구사항
  purpose: >
    제품 목표, MVP 범위, 사용자 관점의 인수 기준, 도메인 개념을 관리하는
    기준 문서다. HTTP·WebSocket의 상세 통신 형식과 구현 일정은 관련 문서에서 관리한다.
  guide: docs/documentation-guide.md

goal: >
  Spring Boot·PostgreSQL API와 React Native·Expo 앱으로 My Petmate MVP를 만든다.
  보호자는 한 마리 이상의 반려견을 등록하고, 안전성과 궁합을 바탕으로 가까운
  산책·놀이 친구를 추천받고, 서로 좋아요를 보낸 상대와 매칭할 수 있다.
  매칭된 보호자는 실시간으로 대화하고 산책·놀이 약속을 조율하며, 약속이 끝난 뒤
  상대 보호자에 대한 비공개 평가를 남길 수 있다.

constraints:
  - 백엔드는 Spring Boot를 사용한다.
  - 백엔드는 Java 21 LTS, Spring Boot 3.x, Gradle Kotlin DSL을 사용한다.
  - >
    백엔드 형식 검사는 Spotless와 Google Java Format을 사용하고,
    `./gradlew check`에 형식 검사를 포함한다.
  - 커밋 메시지는 영어 Conventional Commits 형식을 사용한다.
  - 브랜치 이름은 `<type>/<short-kebab-summary>` 형식을 사용한다.
  - >
    Pull Request는 저장소 템플릿의 Summary, Changes, Verification,
    Checklist 항목을 사용한다.
  - >
    AI 에이전트는 코드나 빌드 설정을 바꾸기 전에 `AGENTS.md`와
    `docs/development-conventions.md`를 읽는다.
  - MVP의 주 데이터베이스로 PostgreSQL를 사용한다.
  - 모바일 앱은 Android·iOS 개발을 위해 React Native와 Expo를 사용한다.
  - >
    MVP 인증은 이메일·비밀번호, JWT access token, refresh token,
    비밀번호 해시, token 갱신, 로그아웃을 지원한다.
  - >
    소셜 로그인, 휴대전화 인증, 기기·세션 관리, push 알림, 지도 탐색,
    calendar 연동, 결제, 공개 평가·평점, 단체 산책, 관리자 Web UI,
    증빙 문서 검토는 MVP 범위에서 제외한다.
  - >
    사용자에게 정확한 실시간 위치를 노출하지 않는다. 근사 거리와 주 활동 지역만
    표시할 수 있다.
  - >
    보호자의 성별·커플·가족 정보는 보호자가 공개로 설정한 경우에만 표시하고
    추천 필터에 사용할 수 있다.
  - >
    추천의 보호자 정보 공개는 상호적이다. 정보를 공개한 보호자는 정보를 공개한
    후보만 추천받는다.
  - >
    한 보호자 계정은 여러 반려견을 등록할 수 있다. 추천, 좋아요, 매칭, 채팅,
    약속 흐름은 한 번에 선택한 반려견 한 쌍을 기준으로 동작한다.
  - 추천은 batch 작업으로 미리 계산하지 않고 요청 시점에 계산한다.
  - >
    추천 선호 필터는 선택 조건이다. 서버의 안전 제외가 항상 먼저 실행되며
    클라이언트가 이를 완화할 수 없다.
  - >
    반려견 사진은 API를 통해 S3 비공개 bucket에 저장하고, 클라이언트에는
    영구 공개 URL 대신 만료되는 조회 URL을 반환한다.
  - >
    종료된 매칭은 MVP에서 다시 열거나 채팅에 사용할 수 없다. 매칭 종료는
    보호자 차단·신고와 구분한다.
  - >
    채팅 내역은 cursor pagination을 사용한다. WebSocket 전송은 클라이언트가
    만든 멱등성 키와 명시적인 성공·실패 이벤트를 사용한다.
  - >
    REST 오류는 `application/problem+json`의 RFC 9457 `ProblemDetail`을 사용하고,
    My Petmate 확장 필드인 `code`, 선택적 `fieldErrors`, `requestId`를 포함한다.

acceptance_criteria:
  - >
    보호자는 회원가입, 로그인, 로그아웃, token 갱신을 할 수 있고 유효한 JWT로만
    보호된 API와 앱 화면에 접근할 수 있다.
  - >
    보호자는 개인·커플·가족으로 등록할 수 있다. 성별은 개인 계정에서만 입력하며,
    보호자 정보의 공개 여부를 변경할 수 있다.
  - >
    보호자는 이름, 사진, 견종, 나이, 성별, 체중·크기, 중성화 여부, 활동 지역,
    가능 시간대, 예방접종·동물등록 여부, 사회성, 공격성, 선호 산책 강도,
    낯선 반려견 반응, 자기소개를 포함한 반려견 프로필을 생성·수정할 수 있다.
  - >
    견종은 서버가 지원하는 목록에서 선택한다. `mixed_breed`는 일반 선택지 하나이며
    별도의 믹스견 boolean은 사용하지 않는다.
  - >
    앱은 선택한 반려견의 추천 목록과 상세 화면을 제공한다. 위험하거나 명확히
    맞지 않는 후보를 제외하고 숫자 백분율 대신 궁합 등급과 사람이 읽을 수 있는
    이유를 표시한다.
  - >
    보호자는 추천 반려견에 좋아요 또는 패스를 보낼 수 있고, 해당 반려견 쌍이
    서로 좋아요를 보낸 경우에만 매칭이 생성된다.
  - >
    매칭된 보호자는 WebSocket 기반 1:1 채팅에서 일반 텍스트 메시지와 약속 제안
    카드를 주고받을 수 있다.
  - >
    보호자는 채팅방에서 날짜, 시작·종료 시각, 장소를 포함한 약속을 제안할 수 있다.
    상대는 수락하거나 거절할 수 있고, 수락된 약속은 사유와 함께 취소할 수 있다.
  - >
    수락된 약속의 종료 시각 이후 각 참여자는 상대 보호자에게 1~5점의 비공개 평가를
    한 번 남길 수 있다. 태그와 설명은 선택 사항이며 원문과 집계 점수는 상대에게
    공개하지 않는다.
  - >
    보호자는 다른 보호자를 차단하거나 신고할 수 있다. 차단·신고된 사용자는 관련
    추천·채팅 상호작용에서 제외하며, 누적 신고 또는 서버가 분류한 고위험 사유는
    매칭·채팅 접근의 임시 제한으로 이어질 수 있다.
  - >
    신고는 허용된 사유 하나와 선택 설명을 사용하고, 신고 사용자가 심각도를
    직접 정하지 않는다.
  - >
    인증된 보호자는 보호자 정보와 계정 상태를 포함한 현재 사용자 응답으로 앱
    session을 복원할 수 있다.
  - >
    보호자는 프로필 생성 시 초기 사진을 올리고 나중에 교체할 수 있다.
    앱은 공개 storage URL을 제출하지 않는다.
  - >
    보호자는 추천에서 크기, 산책 강도, 사회성, 가능 요일, 최대 거리, 공개 보호자
    정보 필터를 선택적으로 사용할 수 있다. 필터는 안전 제외를 우회하거나 비공개
    정보를 노출하지 않는다.
  - >
    정보를 공개한 보호자는 공개 후보만 추천받고 보호자 정보 필터를 사용할 수 있다.
    비공개 보호자는 이 필터를 사용할 수 없고 모든 후보의 보호자 정보를 비공개로 본다.
  - >
    보호자는 상대를 차단하지 않고 활성 매칭만 종료할 수 있다. 종료된 매칭에서는
    메시지를 조회하거나 보낼 수 없다.
  - >
    채팅 내역을 과거 방향으로 나누어 조회할 수 있고, WebSocket 재전송은 저장 메시지를
    중복 생성하지 않으며, 성공·실패 결과가 명확하다.
  - >
    매칭 목록은 최근 메시지 미리보기와 읽지 않은 수를 제공하고, 채팅을 열면
    보호자의 마지막 읽은 위치를 앞으로 이동할 수 있다.
  - >
    REST의 입력, 인증, 권한, 리소스 없음, 충돌, 업로드, 서버 오류는 공통
    `ProblemDetail` 계약을 따른다.

contract_references:
  rest_wire_contract:
    document: docs/openapi.yaml
    locations: [ paths, components ]
    purpose: REST 메서드·경로·parameter·요청·응답 스키마
  rest_error_contract:
    document: docs/error-response.md
    locations: [ 응답 구조, 요청 ID, HTTP 상태 코드, 오류 코드, Spring 적용 규칙 ]
    purpose: REST 오류 본문과 요청 추적 규칙
  websocket_contract:
    document: docs/websocket-protocol.md
    locations: [ 연결과 인증, 이벤트, 멱등성과 권한, 재연결 ]
    purpose: 실시간 채팅 프레임과 연결 수명 주기
  implementation_plan:
    document: docs/backend-mvp-plan.md
    locations: [ 진행 현황, 마일스톤별 계획 ]
    purpose: 구현 순서와 완료·검증 기준
  m1_gate:
    document: docs/m1-auth-contract-checklist.md
    locations: [ 진입 조건, 구현 순서, 검증 게이트, 완료 게이트 ]
    purpose: M1 인증 작업의 강제 점검 절차

feature_map:
  - name: current_guardian
    milestone: M1
    api:
      - GET /api/guardians/me
      - PATCH /api/guardians/me
    requirement: 인증된 보호자를 복원하고 보호자 유형과 공개 여부를 수정한다.
  - name: dog_photo_upload
    milestone: M2
    api:
      - POST /api/dogs
      - POST /api/dogs/{dogId}/photos
    requirement: 프로필 생성 시 초기 사진을 저장하고 소유한 반려견의 사진을 교체한다.
  - name: recommendation_filters
    milestone: M3
    api:
      - GET /api/dogs/{dogId}/recommendations
    requirement: 안전 제외와 공개 상호성을 지킨 뒤 선택한 선호 조건을 적용한다.
  - name: close_match
    milestone: M4
    api:
      - POST /api/matches/{matchId}/close
    requirement: 차단·신고 없이 참여 중인 활성 매칭을 멱등하게 종료한다.
  - name: reliable_chat
    milestone: M5
    api:
      - GET /api/matches/{matchId}/messages
      - WS /ws
    requirement: 과거 내역 조회와 멱등 메시지 전송을 제공한다.
  - name: unread_messages
    milestone: M5
    api:
      - GET /api/matches
      - POST /api/matches/{matchId}/read
    requirement: 최근 메시지와 읽지 않은 수를 표시하고 읽은 위치를 갱신한다.
  - name: appointment_review
    milestone: M6
    api:
      - POST /api/appointment-proposals/{proposalId}/review
    requirement: 종료된 수락 약속의 상대 보호자를 참여자별 한 번 비공개 평가한다.

ontology_schema:
  name: MyPetmateMvp
  description: 궁합 기반 반려견 산책·놀이 친구 MVP의 도메인 개념 모델이다.
  entities:
    - name: Guardian
      description: 한 마리 이상의 반려견을 등록하는 계정 소유자다.
      constraints:
        - email은 고유하다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: email
          type: string
          required: true
        - name: password_hash
          type: string
          required: true
        - name: profile_type
          type: enum
          values: [ individual, couple, family ]
          required: true
        - name: gender
          type: enum
          values: [ female, male ]
          required: false
        - name: identity_visibility
          type: enum
          values: [ public, private ]
          required: true
        - name: status
          type: enum
          values: [ active, temporarily_restricted, withdrawn ]
          required: true
        - name: created_at
          type: datetime
          required: true
        - name: updated_at
          type: datetime
          required: true

    - name: RefreshToken
      description: opaque refresh token의 hash와 수명 주기를 저장한다.
      constraints:
        - token 원문은 저장하지 않는다.
        - Guardian이 삭제되면 함께 삭제한다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: guardian_id
          type: uuid
          required: true
        - name: token_hash
          type: string
          required: true
        - name: expires_at
          type: datetime
          required: true
        - name: revoked_at
          type: datetime
          required: false
        - name: created_at
          type: datetime
          required: true

    - name: Dog
      description: 추천과 매칭에 사용하는 반려견 프로필이다.
      constraints:
        - 한 Guardian이 여러 Dog를 소유할 수 있다.
        - 정확한 실시간 위치 대신 활동 지역과 근사 좌표만 저장한다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: guardian_id
          type: uuid
          required: true
        - name: name
          type: string
          required: true
        - name: photo_object_key
          type: string
          required: true
        - name: breed
          type: string
          allowed_special_values: [ mixed_breed ]
          required: true
        - name: age
          type: integer
          minimum: 0
          maximum: 30
          required: true
        - name: sex
          type: enum
          values: [ female, male ]
          required: true
        - name: weight_kg
          type: number
          required: true
        - name: size_group
          type: enum
          values: [ small, medium, large ]
          required: true
        - name: neutered
          type: boolean
          required: true
        - name: primary_activity_area
          type: string
          required: true
        - name: approximate_location
          type: geo_point
          required: true
        - name: vaccinated
          type: boolean
          required: true
        - name: animal_registered
          type: boolean
          required: true
        - name: sociability
          type: enum
          values: [ low, medium, high ]
          required: true
        - name: aggression_level
          type: enum
          values: [ none, low, medium, high ]
          required: true
        - name: preferred_walk_intensity
          type: enum
          values: [ slow, moderate, active ]
          required: true
        - name: unfamiliar_dog_reaction
          type: enum
          values: [ calm, cautious, excited, reactive ]
          required: true
        - name: self_introduction
          type: string
          required: true

    - name: DogAvailableTimeSlot
      description: 반려견의 반복 가능한 산책 시간대다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: dog_id
          type: uuid
          required: true
        - name: day_of_week
          type: enum
          required: true
        - name: start_time
          type: time
          required: true
        - name: end_time
          type: time
          required: true

    - name: Recommendation
      description: 선택한 반려견과 후보 반려견의 추천 결과다.
      fields:
        - name: source_dog_id
          type: uuid
          required: true
        - name: candidate_dog_id
          type: uuid
          required: true
        - name: candidate_photo_url
          type: string
          required: true
        - name: compatibility_grade
          type: enum
          values: [ excellent, good, check_conditions ]
          required: true
        - name: reasons
          type: array
          required: true
        - name: approximate_distance_km
          type: number
          required: true
        - name: applied_filters
          type: object
          required: false
        - name: guardian_identity
          type: enum
          values: [ female, male, couple, family ]
          required: false

    - name: DogInteraction
      description: 반려견 쌍에 대한 방향성 있는 좋아요 또는 패스다.
      constraints:
        - "`(from_dog_id, to_dog_id)`는 고유하다."
      fields:
        - name: id
          type: uuid
          required: true
        - name: from_dog_id
          type: uuid
          required: true
        - name: to_dog_id
          type: uuid
          required: true
        - name: status
          type: enum
          values: [ liked, passed ]
          required: true
        - name: created_at
          type: datetime
          required: true

    - name: Match
      description: 상호 좋아요로 생성되는 반려견 쌍의 매칭이다.
      constraints:
        - 순서와 관계없는 반려견 쌍을 기준으로 고유하다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: dog_a_id
          type: uuid
          required: true
        - name: dog_b_id
          type: uuid
          required: true
        - name: status
          type: enum
          values: [ active, blocked, closed ]
          required: true
        - name: closed_at
          type: datetime
          required: false
        - name: created_at
          type: datetime
          required: true

    - name: ChatMessage
      description: 매칭 채팅방의 텍스트 또는 약속 카드 메시지다.
      constraints:
        - "`(match_id, sender_guardian_id, client_message_id)`는 고유하다."
      fields:
        - name: id
          type: uuid
          required: true
        - name: match_id
          type: uuid
          required: true
        - name: sender_guardian_id
          type: uuid
          required: true
        - name: client_message_id
          type: uuid
          required: true
        - name: message_type
          type: enum
          values: [ text, appointment_proposal ]
          required: true
        - name: body
          type: string
          required: false
        - name: appointment_proposal_id
          type: uuid
          required: false
        - name: created_at
          type: datetime
          required: true

    - name: MatchReadState
      description: 보호자별 채팅의 마지막 읽은 위치다.
      constraints:
        - "`(match_id, guardian_id)`는 고유하다."
      fields:
        - name: match_id
          type: uuid
          required: true
        - name: guardian_id
          type: uuid
          required: true
        - name: last_read_message_id
          type: uuid
          required: false
        - name: updated_at
          type: datetime
          required: true

    - name: AppointmentProposal
      description: 매칭 채팅 안에서 제안하는 산책·놀이 약속이다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: match_id
          type: uuid
          required: true
        - name: proposed_by_guardian_id
          type: uuid
          required: true
        - name: date
          type: date
          required: true
        - name: start_time
          type: time
          required: true
        - name: end_time
          type: time
          required: true
        - name: place_text
          type: string
          required: true
        - name: status
          type: enum
          values: [ proposed, accepted, rejected, canceled ]
          required: true
        - name: cancellation_reason
          type: string
          required: false
        - name: created_at
          type: datetime
          required: true
        - name: decided_at
          type: datetime
          required: false

    - name: AppointmentReview
      description: 종료된 약속에서 상대 보호자에게 남기는 비공개 평가다.
      constraints:
        - "`(appointment_proposal_id, reviewer_guardian_id)`는 고유하다."
      fields:
        - name: id
          type: uuid
          required: true
        - name: appointment_proposal_id
          type: uuid
          required: true
        - name: reviewer_guardian_id
          type: uuid
          required: true
        - name: target_guardian_id
          type: uuid
          required: true
        - name: score
          type: integer
          minimum: 1
          maximum: 5
          required: true
        - name: tags
          type: array
          item_values:
            - on_time
            - respectful_communication
            - safe_handling
            - dog_profile_accurate
            - would_meet_again
          required: false
        - name: comment
          type: string
          max_length: 500
          required: false
        - name: created_at
          type: datetime
          required: true

    - name: SafetyAction
      description: 보호자 사이의 차단 또는 신고 조치다.
      fields:
        - name: id
          type: uuid
          required: true
        - name: reporter_guardian_id
          type: uuid
          required: true
        - name: target_guardian_id
          type: uuid
          required: true
        - name: type
          type: enum
          values: [ block, report ]
          required: true
        - name: reason
          type: enum
          values:
            - inappropriate_language
            - harassment
            - threatening_behavior
            - unsafe_dog_handling
            - false_profile
            - no_show
            - other
          required: false
        - name: comment
          type: string
          max_length: 1000
          required: false
        - name: created_at
          type: datetime
          required: true

evaluation_principles:
  - name: safety_first
    description: 위험하거나 명확히 맞지 않는 반려견 쌍은 정렬 전에 제외한다.
    weight: 1.0
  - name: mvp_scope_control
    description: 합의한 MVP만 구현하고 제외 기능을 추가하지 않는다.
    weight: 0.9
  - name: appointment_validation
    description: 매칭 수뿐 아니라 실제 수락 약속과 완료 후 비공개 평가로 성공을 판단한다.
    weight: 0.9
  - name: privacy
    description: 위치는 근사 정보만 노출하고 비공개 보호자 정보가 필터로 추론되지 않게 한다.
    weight: 0.8
  - name: simplicity
    description: 실제 규모가 필요성을 증명하기 전까지 요청 시점 추천과 PostgreSQL만 사용한다.
    weight: 0.7

success_metrics:
  - profile_completion_rate
  - recommendation_filter_usage_rate
  - recommendation_to_like_rate
  - mutual_match_rate
  - chat_start_rate
  - unread_message_open_rate
  - match_close_rate
  - appointment_acceptance_rate
  - appointment_review_submission_rate
  - report_rate
  - block_rate
  - temporary_restriction_rate

exit_conditions:
  - name: mvp_scope_satisfied
    description: 명시적으로 제외한 기능을 추가하지 않고 모든 인수 기준을 구현한다.
    criteria: 모든 `acceptance_criteria`를 충족한다.
  - name: core_flow_observed
    description: >
      테스트 보호자가 회원가입, 반려견 등록, 추천, 상호 좋아요, 채팅, 약속 제안·수락,
      약속 후 평가까지 완료할 수 있다.
    criteria: Spring Boot API와 앱을 연결한 전체 핵심 흐름을 수동으로 확인한다.
  - name: safety_flow_observed
    description: 차단, 신고, 임시 제한 동작을 확인한다.
    criteria: 차단·제한 사용자가 관련 추천·매칭·채팅 흐름에서 제외된다.
  - name: build_and_tests_green
    description: 백엔드와 모바일 앱의 검사가 통과한다.
    criteria: 필요한 build, test, lint, type 검사가 모두 성공한다.

