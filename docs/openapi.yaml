      operationId: acceptAppointmentProposal
      summary: 약속 제안 수락
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 수락된 약속
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentProposal"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/AppointmentStateConflict"
  /api/appointment-proposals/{proposalId}/reject:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      tags: [Appointments]
      operationId: rejectAppointmentProposal
      summary: 약속 제안 거절
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 거절된 약속
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentProposal"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/AppointmentStateConflict"
  /api/appointment-proposals/{proposalId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      tags: [Appointments]
      operationId: cancelAppointmentProposal
      summary: 수락된 약속 취소
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCancelRequest"
            example:
              reason: 반려견 컨디션이 좋지 않아 취소합니다.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 취소된 약속
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentProposal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/AppointmentStateConflict"
  /api/appointment-proposals/{proposalId}/review:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      tags: [Appointments]
      operationId: reviewAppointment
      summary: 종료된 수락 약속의 상대 보호자 비공개 평가
      description: |
        Asia/Seoul 기준 종료 시각이 지난 accepted 약속만 평가할 수 있고 참여자별 한 번만 가능하다.
        응답에는 점수, 태그, 의견 또는 집계 점수를 포함하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentReviewRequest"
            example:
              score: 5
              tags: [on_time, respectful_communication, safe_handling]
              comment: 약속 시간을 잘 지키고 반려견을 세심하게 살펴주셨어요.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "201":
          description: 평가 제출 상태만 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentReviewReceipt"
              example:
                proposalId: cfc7ffb2-4684-42e6-aebc-f6888bfc5cc6
                reviewSubmitted: true
                submittedAt: "2026-07-25T12:10:00+09:00"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/AppointmentStateConflict"
  /api/guardians/{guardianId}/block:
    parameters:
      - $ref: "#/components/parameters/GuardianId"
    post:
      tags: [Safety]
      operationId: blockGuardian
      summary: 보호자 차단
      description: 이후 추천과 관련 match/chat 상호작용에서 제외하며 같은 대상 재요청은 멱등이다.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 차단 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
              example:
                guardianId: 51c9f756-32b0-4181-8879-2f1f8d2d0ff3
                blocked: true
                createdAt: "2026-07-23T12:30:00+09:00"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/guardians/{guardianId}/reports:
    parameters:
      - $ref: "#/components/parameters/GuardianId"
    post:
      tags: [Safety]
      operationId: reportGuardian
      summary: 보호자 신고
      description: 사용자는 정해진 신고 사유를 선택하고 필요한 경우 부연 comment를 작성한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
            example:
              reason: threatening_behavior
              comment: 채팅에서 반복적으로 위협적인 표현을 사용했습니다.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "201":
          description: 신고 접수 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
              example:
                reportId: 7bf86f1f-a0c6-45eb-8317-a5721022f884
                guardianId: 51c9f756-32b0-4181-8879-2f1f8d2d0ff3
                submittedAt: "2026-07-23T12:35:00+09:00"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization 헤더에 `Bearer {accessToken}`을 전달한다.
  headers:
    RequestId:
      description: |
        서버가 이 HTTP 요청을 위해 생성한 추적 식별자다. `req-`와 26자 Crockford
        Base32 ULID로 구성되며, 오류 응답에서는 ProblemDetail의 `requestId`와 같다.
      schema:
        type: string
        pattern: "^req-[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      example: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
  parameters:
    DogId:
      name: dogId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuardianId:
      name: guardianId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SizeGroups:
      name: sizeGroups
      in: query
      required: false
      description: 쉼표로 구분한 복수 선택. 생략하면 이 차원을 제한하지 않는다.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          $ref: "#/components/schemas/SizeGroup"
    WalkIntensities:
      name: walkIntensities
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          $ref: "#/components/schemas/WalkIntensity"
    SociabilityLevels:
      name: sociabilityLevels
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          $ref: "#/components/schemas/Sociability"
    AvailableDays:
      name: availableDays
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 7
        uniqueItems: true
        items:
          $ref: "#/components/schemas/DayOfWeek"
    MaxDistanceKm:
      name: maxDistanceKm
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: 0.5
        maximum: 50
        multipleOf: 0.1
      example: 5
    GuardianIdentities:
      name: guardianIdentities
      in: query
      required: false
      description: 공개 요청자만 사용할 수 있다.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: "#/components/schemas/GuardianIdentity"
    BeforeCursor:
      name: before
      in: query
      required: false
      description: 이전 응답의 nextBefore opaque cursor. 첫 페이지에서는 생략한다.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[A-Za-z0-9_-]+={0,2}$"
    MessageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  schemas:
    ProfileType:
      type: string
      enum: [individual, couple, family]
    Gender:
      type: string
      enum: [female, male]
    IdentityVisibility:
      type: string
      enum: [public, private]
    GuardianStatus:
      type: string
      enum: [active, temporarily_restricted, withdrawn]
    GuardianIdentity:
      type: string
      enum: [female, male, couple, family]
      description: |
        추천에 공개하는 파생 값이다. individual 보호자는 gender를 사용하고,
        couple과 family 보호자는 각각 couple과 family를 사용한다.
        identityVisibility가 private이면 이 값 대신 null을 반환한다.
    BreedCode:
      type: string
      enum:
        - mixed_breed
        - maltese
        - poodle
        - pomeranian
        - shih_tzu
        - bichon_frise
        - chihuahua
        - yorkshire_terrier
        - dachshund
        - beagle
        - french_bulldog
        - welsh_corgi
        - golden_retriever
        - labrador_retriever
        - jindo
        - other
      description: MVP에서 서버와 프론트가 공통으로 지원하는 견종 코드.
    Guardian:
      oneOf:
        - $ref: "#/components/schemas/IndividualGuardian"
        - $ref: "#/components/schemas/CoupleGuardian"
        - $ref: "#/components/schemas/FamilyGuardian"
      discriminator:
        propertyName: profileType
        mapping:
          individual: "#/components/schemas/IndividualGuardian"
          couple: "#/components/schemas/CoupleGuardian"
          family: "#/components/schemas/FamilyGuardian"
    IndividualGuardian:
      type: object
      additionalProperties: false
      required: [id, email, profileType, gender, identityVisibility, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: "^[!-~]+$"
        profileType:
          const: individual
        gender:
          $ref: "#/components/schemas/Gender"
        identityVisibility:
          $ref: "#/components/schemas/IdentityVisibility"
        status:
          $ref: "#/components/schemas/GuardianStatus"
    CoupleGuardian:
      type: object
      additionalProperties: false
      required: [id, email, profileType, identityVisibility, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: "^[!-~]+$"
        profileType:
          const: couple
        identityVisibility:
          $ref: "#/components/schemas/IdentityVisibility"
        status:
          $ref: "#/components/schemas/GuardianStatus"
    FamilyGuardian:
      type: object
      additionalProperties: false
      required: [id, email, profileType, identityVisibility, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: "^[!-~]+$"
        profileType:
          const: family
        identityVisibility:
          $ref: "#/components/schemas/IdentityVisibility"
        status:
          $ref: "#/components/schemas/GuardianStatus"
    SignupRequest:
      oneOf:
        - $ref: "#/components/schemas/IndividualSignupRequest"
        - $ref: "#/components/schemas/CoupleSignupRequest"
        - $ref: "#/components/schemas/FamilySignupRequest"
