        매칭 목록 선택 후 화면 전환 자체는 즉시 수행한다. 채팅 화면은 이 API로 헤더의 반려견 정보와
        현재 match 상태를 최신화하며, 딥 링크·앱 복원·재연결로 목록 데이터 없이 진입할 때도 사용한다.
      responses:
