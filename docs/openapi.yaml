        - RESOURCE_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - STATE_CONFLICT
        - MATCH_CLOSED
        - MATCH_BLOCKED
        - APPOINTMENT_STATE_CONFLICT
        - REVIEW_NOT_ELIGIBLE
        - REVIEW_ALREADY_SUBMITTED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - METHOD_NOT_ALLOWED
        - NOT_ACCEPTABLE
        - INTERNAL_SERVER_ERROR
      description: 앱이 오류별 동작을 결정할 때 사용하는 안정적인 기계 판독용 코드.
    ProblemDetail:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details에 My Petmate 확장 필드를 추가한 REST 오류 응답.
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type:
          type: string
          format: uri
          maxLength: 200
          description: 오류 종류의 안정적인 URI 식별자. 같은 code는 같은 type을 사용한다.
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 오류 종류를 요약하는 짧고 안정적인 제목.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 실제 HTTP 응답 status와 동일한 값.
        detail:
          type: string
          minLength: 1
          maxLength: 500
          description: 이번 요청이 실패한 이유를 설명하는 사용자 표시 가능 메시지.
        instance:
          type: string
          format: uri-reference
          maxLength: 2048
          description: 오류가 발생한 요청 경로. query의 민감한 값은 포함하지 않는다.
        code:
          $ref: "#/components/schemas/ErrorCode"
        fieldErrors:
          type: array
          maxItems: 100
          description: 입력 validation 오류일 때만 포함하는 필드별 오류 목록.
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type: string
          pattern: "^req-[0-7][0-9A-HJKMNP-TV-Z]{25}$"
          description: |
            서버가 요청마다 생성하며 서버 로그와 사용자 문의를 연결하는 추적 식별자.
            같은 오류 응답의 `X-Request-Id` header와 반드시 같은 값이다.
  responses:
    ValidationError:
      description: 요청 body, query 또는 path 입력값 validation 실패
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:validation-failed
            title: 입력값 검증 실패
            status: 400
            detail: 요청값을 확인해 주세요.
            instance: /api/guardians/me
            code: VALIDATION_FAILED
            fieldErrors:
              - field: gender
                reason: profileType이 individual이면 필수입니다.
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    RecommendationValidationError:
      description: 추천 query validation 또는 공개 상호성 규칙 위반
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            fieldValidation:
              value:
                type: urn:my-petmate:problem:validation-failed
                title: 입력값 검증 실패
                status: 400
                detail: 추천 필터 값을 확인해 주세요.
                instance: /api/dogs/70f7bb4f-d399-469f-b5a5-31b229ec4500/recommendations
                code: VALIDATION_FAILED
                fieldErrors:
                  - field: maxDistanceKm
                    reason: 0.5 이상 50 이하이어야 합니다.
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
            identityDisclosure:
              value:
                type: urn:my-petmate:problem:identity-disclosure-required
                title: 보호자 정보 공개 필요
                status: 400
                detail: 보호자 정보 필터를 사용하려면 본인 정보도 공개해야 합니다.
                instance: /api/dogs/70f7bb4f-d399-469f-b5a5-31b229ec4500/recommendations
                code: IDENTITY_DISCLOSURE_REQUIRED
                fieldErrors:
                  - field: guardianIdentities
                    reason: 비공개 보호자는 사용할 수 없습니다.
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    AuthenticationError:
      description: access token 누락, 오류 또는 만료
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            expired:
              value:
                type: urn:my-petmate:problem:auth-token-expired
                title: access token 만료
                status: 401
                detail: access token이 만료되었습니다.
                instance: /api/guardians/me
                code: AUTH_TOKEN_EXPIRED
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
            invalid:
              value:
                type: urn:my-petmate:problem:auth-token-invalid
                title: 유효하지 않은 access token
                status: 401
                detail: 유효한 access token이 필요합니다.
                instance: /api/guardians/me
                code: AUTH_TOKEN_INVALID
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    InvalidCredentialsError:
      description: 로그인 자격 증명 오류
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:invalid-credentials
            title: 유효하지 않은 로그인 정보
            status: 401
            detail: 이메일 또는 비밀번호가 올바르지 않습니다.
            instance: /api/auth/login
            code: AUTH_INVALID_CREDENTIALS
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    RefreshTokenError:
      description: refresh token 만료, 폐기, 오류 또는 재사용
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:refresh-token-invalid
            title: 유효하지 않은 refresh token
            status: 401
            detail: refresh token이 만료되었거나 유효하지 않습니다.
            instance: /api/auth/refresh
            code: AUTH_REFRESH_INVALID
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    PermissionError:
      description: 인증됐지만 리소스 또는 기능에 대한 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            forbidden:
              value:
                type: urn:my-petmate:problem:forbidden
                title: 접근 권한 없음
                status: 403
                detail: 이 작업을 수행할 권한이 없습니다.
                instance: /api/dogs/70f7bb4f-d399-469f-b5a5-31b229ec4500
                code: FORBIDDEN
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
            accountRestricted:
              value:
                type: urn:my-petmate:problem:account-restricted
                title: 제한된 계정
                status: 403
                detail: 현재 계정은 추천 또는 채팅을 사용할 수 없습니다.
                instance: /api/dogs/70f7bb4f-d399-469f-b5a5-31b229ec4500/recommendations
                code: ACCOUNT_RESTRICTED
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    NotFoundError:
      description: 리소스 없음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:resource-not-found
            title: 리소스를 찾을 수 없음
            status: 404
            detail: 요청한 리소스를 찾을 수 없습니다.
            instance: /api/dogs/70f7bb4f-d399-469f-b5a5-31b229ec4500
            code: RESOURCE_NOT_FOUND
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    EmailAlreadyExistsError:
      description: 이미 가입된 이메일과 충돌
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:email-already-exists
            title: 이미 가입된 이메일
            status: 409
            detail: 이미 사용 중인 이메일입니다.
            instance: /api/auth/signup
            code: EMAIL_ALREADY_EXISTS
            fieldErrors:
              - field: email
                reason: 이미 사용 중인 이메일입니다.
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    ConflictError:
      description: 현재 리소스 상태 또는 중복 요청과 충돌
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:state-conflict
            title: 상태 충돌
            status: 409
            detail: 현재 상태에서는 요청을 처리할 수 없습니다.
            instance: /api/dogs/70f7bb4f-d399-469f-b5a5-31b229ec4500/likes
            code: STATE_CONFLICT
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    MatchUnavailableError:
      description: closed 또는 blocked match는 조회·전송·읽음 갱신할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            closed:
              value:
                type: urn:my-petmate:problem:match-closed
                title: 종료된 매칭
                status: 409
                detail: 종료된 매칭에서는 채팅을 사용할 수 없습니다.
                instance: /api/matches/45dd6b51-5924-4b2d-aab8-697f09a12bbb/messages
                code: MATCH_CLOSED
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
            blocked:
              value:
                type: urn:my-petmate:problem:match-blocked
                title: 차단된 매칭
                status: 409
                detail: 차단된 매칭에서는 채팅을 사용할 수 없습니다.
                instance: /api/matches/45dd6b51-5924-4b2d-aab8-697f09a12bbb/messages
                code: MATCH_BLOCKED
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    AppointmentStateConflict:
      description: 약속 상태, 종료 시각 또는 중복 평가 충돌
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            invalidState:
              value:
                type: urn:my-petmate:problem:appointment-state-conflict
                title: 약속 상태 충돌
                status: 409
                detail: 현재 약속 상태에서는 요청을 처리할 수 없습니다.
                instance: /api/appointment-proposals/cfc7ffb2-4684-42e6-aebc-f6888bfc5cc6/accept
                code: APPOINTMENT_STATE_CONFLICT
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
            reviewNotEligible:
              value:
                type: urn:my-petmate:problem:review-not-eligible
                title: 평가 자격 없음
                status: 409
                detail: 종료된 수락 약속만 평가할 수 있습니다.
                instance: /api/appointment-proposals/cfc7ffb2-4684-42e6-aebc-f6888bfc5cc6/review
                code: REVIEW_NOT_ELIGIBLE
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
            reviewAlreadySubmitted:
              value:
                type: urn:my-petmate:problem:review-already-submitted
                title: 이미 제출한 평가
                status: 409
                detail: 이 약속에 대한 평가를 이미 제출했습니다.
                instance: /api/appointment-proposals/cfc7ffb2-4684-42e6-aebc-f6888bfc5cc6/review
                code: REVIEW_ALREADY_SUBMITTED
                requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    PayloadTooLargeError:
      description: 업로드 파일이 허용 크기를 초과함
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:payload-too-large
            title: 요청 본문 크기 초과
            status: 413
            detail: 사진은 최대 10 MiB까지 업로드할 수 있습니다.
            instance: /api/dogs
            code: PAYLOAD_TOO_LARGE
            fieldErrors:
              - field: photo
                reason: 파일 크기가 10 MiB를 초과했습니다.
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    UnsupportedMediaTypeError:
      description: 요청 Content-Type 또는 업로드 파일 media type을 지원하지 않음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:unsupported-media-type
            title: 지원하지 않는 미디어 형식
            status: 415
            detail: 지원하지 않는 사진 형식입니다.
            instance: /api/dogs
            code: UNSUPPORTED_MEDIA_TYPE
            fieldErrors:
              - field: photo
                reason: JPEG, PNG 또는 WebP 파일만 사용할 수 있습니다.
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    MethodNotAllowedError:
      description: endpoint가 요청 HTTP method를 지원하지 않음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:method-not-allowed
            title: 지원하지 않는 HTTP 메서드
            status: 405
            detail: 이 endpoint에서 지원하지 않는 HTTP method입니다.
            instance: /api/guardians/me
            code: METHOD_NOT_ALLOWED
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    NotAcceptableError:
      description: 요청 Accept 헤더에 맞는 응답 형식을 생성할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:not-acceptable
            title: 지원하지 않는 응답 형식
            status: 406
            detail: 요청한 응답 media type을 지원하지 않습니다.
            instance: /api/guardians/me
            code: NOT_ACCEPTABLE
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
    InternalServerError:
      description: 예상하지 못한 서버 오류. 내부 예외 정보는 노출하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: urn:my-petmate:problem:internal-server-error
            title: 서버 내부 오류
            status: 500
            detail: 요청을 처리하는 중 오류가 발생했습니다.
            instance: /api/guardians/me
            code: INTERNAL_SERVER_ERROR
            requestId: req-01ARZ3NDEKTSV4RRFFQ69G5FAV
