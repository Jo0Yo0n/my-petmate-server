    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: "^[!-~]+$"
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 256-bit 무작위 값을 padding 없는 Base64 URL 형식으로 인코딩한 opaque token.
          writeOnly: true
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        accessToken:
          type: string
          minLength: 20
          maxLength: 4096
          readOnly: true
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 256-bit 무작위 값을 padding 없는 Base64 URL 형식으로 인코딩한 opaque token.
          readOnly: true
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
        refreshExpiresIn:
          type: integer
          const: 2592000
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
        - guardian
      properties:
        accessToken:
          type: string
          minLength: 20
          maxLength: 4096
          readOnly: true
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 256-bit 무작위 값을 padding 없는 Base64 URL 형식으로 인코딩한 opaque token.
          readOnly: true
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
        refreshExpiresIn:
          type: integer
          const: 2592000
        guardian:
          $ref: "#/components/schemas/Guardian"
    SizeGroup:
      type: string
      enum: [small, medium, large]
    DogSex:
      type: string
      enum: [female, male]
    Sociability:
      type: string
      enum: [low, medium, high]
    AggressionLevel:
      type: string
      enum: [none, low, medium, high]
    WalkIntensity:
      type: string
      enum: [slow, moderate, active]
    UnfamiliarDogReaction:
      type: string
      enum: [calm, cautious, excited, reactive]
    DayOfWeek:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    ApproximateLocationInput:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      description: |
        서버는 입력 좌표를 약 1km 수준(소수점 둘째 자리)으로 낮춰 저장하고 원본 좌표를 보존하지 않는다.
        이 객체는 소유자 쓰기 요청 전용이며 Dog 응답에는 포함되지 않는다.
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    AvailableTimeSlot:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startTime, endTime]
      description: startTime은 endTime보다 빨라야 한다.
      properties:
        dayOfWeek:
          $ref: "#/components/schemas/DayOfWeek"
        startTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "09:00"
        endTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "11:00"
    DogProfileInput:
      type: object
      additionalProperties: false
      required:
        - name
        - breed
        - age
        - sex
        - weightKg
        - sizeGroup
        - neutered
        - primaryActivityArea
        - approximateLocation
        - availableTimeSlots
        - vaccinated
        - animalRegistered
        - sociability
        - aggressionLevel
        - preferredWalkIntensity
        - unfamiliarDogReaction
        - selfIntroduction
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ".*\\S.*"
        breed:
          $ref: "#/components/schemas/BreedCode"
        age:
          type: integer
          minimum: 0
          maximum: 30
          description: 만 나이(년). 1살 미만은 0으로 전달한다.
          example: 4
        sex:
          $ref: "#/components/schemas/DogSex"
        weightKg:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 100
          multipleOf: 0.1
        sizeGroup:
          $ref: "#/components/schemas/SizeGroup"
        neutered:
          type: boolean
        primaryActivityArea:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ".*\\S.*"
        approximateLocation:
          $ref: "#/components/schemas/ApproximateLocationInput"
        availableTimeSlots:
          type: array
          minItems: 1
          maxItems: 21
          items:
            $ref: "#/components/schemas/AvailableTimeSlot"
        vaccinated:
          type: boolean
        animalRegistered:
          type: boolean
        sociability:
          $ref: "#/components/schemas/Sociability"
        aggressionLevel:
          $ref: "#/components/schemas/AggressionLevel"
        preferredWalkIntensity:
          $ref: "#/components/schemas/WalkIntensity"
        unfamiliarDogReaction:
          $ref: "#/components/schemas/UnfamiliarDogReaction"
        selfIntroduction:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ".*\\S.*"
    DogPhoto:
