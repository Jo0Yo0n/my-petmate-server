openapi: 3.1.0
info:
  title: My Petmate MVP API
  version: 1.0.0
  description: |
    My Petmate MVP의 REST API 계약이다. 모든 날짜/시간 기반 약속 규칙은
    `Asia/Seoul` 기준이며, 다른 사용자에게 정확한 위치나 비공개 평가를 반환하지 않는다.

    추천 후보 처리 순서는 `안전·차단·신고 제외 → 공개 상호성 → 선호 조건 → 궁합 정렬`이다.
    공개 여부 변경은 다음 추천 요청부터 적용되며 기존 match/chat에는 영향을 주지 않는다.
  x-time-zone: Asia/Seoul
  x-token-policy:
    accessTokenTtlSeconds: 900
    accessTokenIssuer: my-petmate-server
    accessTokenAudience: my-petmate-api
    accessTokenAlgorithm: HS256
    accessTokenClockSkewSeconds: 0
    tokenType: Bearer
    refreshTokenTtlSeconds: 2592000
    refreshTokenFormat: opaque-base64url-without-padding
    refreshTokenEntropyBits: 256
    refreshTokenLength: 43
    refreshTokenStorage: sha-256-hash-only
    refreshTokenRotation: rotate-on-every-refresh
    refreshTokenReuse: reject
    concurrent401Handling: refresh-once-and-retry-each-request-once
  x-email-policy:
    canonicalization: trim-and-lowercase
    lowercaseLocale: root
    allowedCharacterSet: ascii-printable
    appliesTo: [signup, login, storage, response]
    uniqueness: case-insensitive
  x-privacy-policy:
    exactLocationReturned: false
    rawReviewsReturned: false
    aggregateReviewScoresReturned: false
  x-websocket-protocol: ./websocket-protocol.md
  x-error-response-contract: ./error-response.md
  x-request-id-policy:
    generatedBy: server
    scope: every-http-request
    format: req-{26-character-crockford-base32-ulid}
    pattern: "^req-[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    incomingRequestHeader: ignored
    responseHeader: X-Request-Id
    requestAttribute: requestId
    mdcKey: requestId
    securityOrder: before-spring-security
    problemDetailField: requestId
    cleanup: clear-mdc-in-finally
servers:
  - url: http://localhost:8080
    description: 로컬 개발
tags:
  - name: Auth
  - name: Guardians
  - name: Dogs
  - name: Recommendations
  - name: Likes
  - name: Matches
  - name: Chat
  - name: Appointments
  - name: Safety
security:
  - bearerAuth: []
paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: 보호자 계정 생성
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              individual:
                value:
                  email: yuna@example.com
                  password: StrongPass123!
                  profileType: individual
                  gender: female
                  identityVisibility: public
              couple:
                value:
                  email: couple@example.com
                  password: StrongPass123!
                  profileType: couple
                  identityVisibility: private
              family:
                value:
                  email: family@example.com
                  password: StrongPass123!
                  profileType: family
                  identityVisibility: public
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "201":
          description: 계정과 토큰 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.access.signature
                refreshToken: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdef
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 2592000
                guardian:
                  id: 1c29bceb-6e56-4c55-a62d-f0b6a0612b59
                  email: yuna@example.com
                  profileType: individual
                  gender: female
                  identityVisibility: public
                  status: active
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/EmailAlreadyExistsError"
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 이메일과 비밀번호로 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: yuna@example.com
              password: StrongPass123!
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentialsError"
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: 토큰 갱신
      description: |
        유효한 refresh token을 한 번 사용하면 기존 token을 폐기하고 새 access/refresh token 쌍을 발급한다.
        만료·폐기·재사용된 refresh token은 `AUTH_REFRESH_INVALID`를 반환한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdef
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 토큰 회전 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.new-access.signature
                refreshToken: abcdef_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 2592000
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/RefreshTokenError"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: refresh token 폐기
      description: 이미 폐기됐거나 서버에 존재하지 않는 올바른 형식의 token으로 재요청해도 성공하는 멱등 연산이다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdef
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: 로그아웃 완료
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/guardians/me:
    get:
      tags: [Guardians]
      operationId: getCurrentGuardian
      summary: 현재 보호자 조회
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 현재 보호자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardian"
              example:
                id: 1c29bceb-6e56-4c55-a62d-f0b6a0612b59
                email: yuna@example.com
                profileType: individual
                gender: female
                identityVisibility: public
                status: active
        "401":
          $ref: "#/components/responses/AuthenticationError"
    patch:
      tags: [Guardians]
      operationId: updateCurrentGuardian
      summary: 보호자 유형과 공개 설정 수정
      description: |
        `profileType=individual`이면 `gender`가 필수이고, `couple` 또는 `family`이면 생략하거나 `null`이어야 한다.
        비공개를 원하는 보호자는 `identityVisibility=private`을 사용한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianUpdateRequest"
            example:
              profileType: couple
              identityVisibility: private
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 수정된 보호자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardian"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /api/dogs:
    post:
      tags: [Dogs]
      operationId: createDog
      summary: 반려견 프로필과 초기 사진 생성
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [profile, photo]
              properties:
                profile:
                  $ref: "#/components/schemas/DogProfileInput"
                photo:
                  $ref: "#/components/schemas/DogPhoto"
            encoding:
              profile:
                contentType: application/json
              photo:
                contentType: image/jpeg, image/png, image/webp
            example:
              profile:
                name: 보리
                breed: mixed_breed
                age: 4
                sex: female
                weightKg: 8.4
                sizeGroup: small
                neutered: true
                primaryActivityArea: 서울특별시 마포구 연남동
                approximateLocation:
                  latitude: 37.56
                  longitude: 126.92
                availableTimeSlots:
                  - dayOfWeek: saturday
                    startTime: "09:00"
                    endTime: "11:00"
                vaccinated: true
                animalRegistered: true
                sociability: high
                aggressionLevel: none
                preferredWalkIntensity: moderate
                unfamiliarDogReaction: calm
                selfIntroduction: 천천히 인사하고 함께 걷는 것을 좋아해요.
              photo: (binary JPEG)
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "201":
          description: 생성된 반려견
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
    get:
      tags: [Dogs]
      operationId: listMyDogs
      summary: 내 반려견 목록
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 내 반려견 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/Dog"
              example:
                items:
                  - id: 70f7bb4f-d399-469f-b5a5-31b229ec4500
                    name: 보리
                    photoUrl: https://cdn.example.com/private/bori.jpg?expires=...
                    breed: mixed_breed
                    age: 4
                    sex: female
                    weightKg: 8.4
                    sizeGroup: small
                    neutered: true
                    primaryActivityArea: 서울특별시 마포구 연남동
                    availableTimeSlots:
                      - dayOfWeek: saturday
                        startTime: "09:00"
                        endTime: "11:00"
                    vaccinated: true
                    animalRegistered: true
                    sociability: high
                    aggressionLevel: none
                    preferredWalkIntensity: moderate
                    unfamiliarDogReaction: calm
                    selfIntroduction: 천천히 인사하고 함께 걷는 것을 좋아해요.
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /api/dogs/{dogId}:
    parameters:
      - $ref: "#/components/parameters/DogId"
    get:
      tags: [Dogs]
      operationId: getMyDog
      summary: 내 반려견 단건 조회
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 내 반려견
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Dogs]
      operationId: updateMyDog
      summary: 내 반려견 프로필 수정
      description: 사진은 이 endpoint가 아니라 `/photos`에서 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogProfileInput"
            example:
              name: 보리
              breed: mixed_breed
              age: 4
              sex: female
              weightKg: 8.8
              sizeGroup: small
              neutered: true
              primaryActivityArea: 서울특별시 마포구 연남동
              approximateLocation:
                latitude: 37.56
                longitude: 126.92
              availableTimeSlots:
                - dayOfWeek: sunday
                  startTime: "10:00"
                  endTime: "12:00"
              vaccinated: true
              animalRegistered: true
              sociability: high
              aggressionLevel: none
              preferredWalkIntensity: active
              unfamiliarDogReaction: calm
              selfIntroduction: 주말 오전 산책 친구를 찾아요.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 수정된 반려견
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/dogs/{dogId}/photos:
    parameters:
      - $ref: "#/components/parameters/DogId"
    post:
      tags: [Dogs]
      operationId: replaceDogPhoto
      summary: 반려견 사진 교체
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [photo]
              properties:
                photo:
                  $ref: "#/components/schemas/DogPhoto"
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
            example:
              photo: (binary JPEG)
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 사진이 교체된 반려견
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/dogs/{dogId}/recommendations:
    parameters:
      - $ref: "#/components/parameters/DogId"
    get:
      tags: [Recommendations]
      operationId: listDogRecommendations
      summary: 요청 시점 추천 목록 계산
      parameters:
        - $ref: "#/components/parameters/SizeGroups"
        - $ref: "#/components/parameters/WalkIntensities"
        - $ref: "#/components/parameters/SociabilityLevels"
        - $ref: "#/components/parameters/AvailableDays"
        - $ref: "#/components/parameters/MaxDistanceKm"
        - $ref: "#/components/parameters/GuardianIdentities"
      description: |
        안전·차단·신고 제외, 공개 상호성, 명시된 선호 조건, 궁합 정렬 순서로 처리한다.
        공개 요청자는 공개 후보만 받고 guardianIdentities를 사용할 수 있다.
        비공개 요청자는 공개·비공개 후보를 받을 수 있지만 모든 guardianIdentity가 null이며,
        guardianIdentities를 보내면 `IDENTITY_DISCLOSURE_REQUIRED`가 반환된다.
        정확한 좌표는 반환하지 않는다.
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 추천 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationList"
              example:
                items:
                  - dog:
                      id: e514d9ad-0a7e-4e50-b62a-b3cbb112e2ee
                      name: 구름
                      photoUrl: https://cdn.example.com/private/gureum.jpg?expires=...
                      breed: poodle
                      age: 3
                      sex: male
                      weightKg: 7.1
                      sizeGroup: small
                      neutered: true
                      primaryActivityArea: 서울특별시 마포구 망원동
                      availableTimeSlots:
                        - dayOfWeek: saturday
                          startTime: "10:00"
                          endTime: "12:00"
                      vaccinated: true
                      animalRegistered: true
                      sociability: high
                      aggressionLevel: none
                      preferredWalkIntensity: moderate
                      unfamiliarDogReaction: calm
                      selfIntroduction: 친구와 나란히 걷는 걸 좋아해요.
                    guardianIdentity: male
                    compatibilityGrade: excellent
                    reasons:
                      - 산책 강도와 사회성이 잘 맞아요.
                      - 토요일 가능 시간이 겹쳐요.
                    approximateDistanceKm: 1.8
                appliedFilters:
                  sizeGroups: [small]
                  walkIntensities: [moderate]
                  sociabilityLevels: []
                  availableDays: [saturday]
                  maxDistanceKm: 5
                  guardianIdentities: [male]
        "400":
          $ref: "#/components/responses/RecommendationValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/dogs/{dogId}/likes:
    parameters:
      - $ref: "#/components/parameters/DogId"
    post:
      tags: [Likes]
      operationId: createDogInteraction
      summary: 추천 반려견에 like 또는 pass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogInteractionRequest"
            examples:
              like:
                value:
                  targetDogId: e514d9ad-0a7e-4e50-b62a-b3cbb112e2ee
                  status: liked
              pass:
                value:
                  targetDogId: e514d9ad-0a7e-4e50-b62a-b3cbb112e2ee
                  status: passed
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: interaction 저장 결과. 상호 like이면 match가 생성된다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DogInteractionResponse"
              example:
                status: liked
                matched: true
                match:
                  id: 45dd6b51-5924-4b2d-aab8-697f09a12bbb
                  status: active
                  myDog:
                    id: 70f7bb4f-d399-469f-b5a5-31b229ec4500
                    name: 보리
                    photoUrl: https://cdn.example.com/private/bori.jpg?expires=...
                  otherDog:
                    id: e514d9ad-0a7e-4e50-b62a-b3cbb112e2ee
                    name: 구름
                    photoUrl: https://cdn.example.com/private/gureum.jpg?expires=...
                  createdAt: "2026-07-23T10:15:30+09:00"
                  closedAt: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/matches:
    get:
      tags: [Matches]
      operationId: listActiveMatches
      summary: 최근 메시지와 unreadCount가 포함된 활성 매칭 목록
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: 활성 매칭 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: "#/components/schemas/MatchListItem"
              example:
                items:
                  - id: 45dd6b51-5924-4b2d-aab8-697f09a12bbb
                    status: active
                    myDog:
                      id: 70f7bb4f-d399-469f-b5a5-31b229ec4500
                      name: 보리
                      photoUrl: https://cdn.example.com/private/bori.jpg?expires=...
                    otherDog:
